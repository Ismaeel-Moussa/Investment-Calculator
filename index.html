<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Investment Calculator - Compound Interest & Wealth Simulator</title>
    <meta name="description" content="Calculate the future value of your wealth with compound interest. Live projections, interactive charts, and year-by-year schedules for monthly recurring and lump-sum investments." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta id="apple-app-title" name="apple-mobile-web-app-title" content="Investment Calculator" />
    <script>
      (function() {
        try {
          var savedLang = localStorage.getItem('investment_calc_lang');
          var isAr = savedLang === 'ar' || (!savedLang && (navigator.language || '').toLowerCase().startsWith('ar'));
          var manifestEl = document.getElementById('app-manifest');
          var appleTitle = document.getElementById('apple-app-title');
          if (isAr) {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
            if (manifestEl) manifestEl.setAttribute('href', '/manifest-ar.webmanifest');
            if (appleTitle) appleTitle.setAttribute('content', 'حاسبة الاستثمار');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Modern Typography: Inter, Plus Jakarta Sans, IBM Plex Sans Arabic, Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
