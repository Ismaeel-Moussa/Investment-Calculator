    <!-- Inline Init: Defaults to Arabic and Light Mode without FOUC -->
    <script>
      (function() {
        try {
          var savedLang = localStorage.getItem('investment_calc_lang');
          var isEn = savedLang === 'en';
          var isAr = !isEn; // Arabic is default
          var manifestEl = document.getElementById('app-manifest');
          var appleTitle = document.getElementById('apple-app-title');
          if (isAr) {
            document.documentElement.lang = 'ar';
            document.documentElement.dir = 'rtl';
            if (manifestEl) manifestEl.setAttribute('href', '/manifest-ar.webmanifest');
            if (appleTitle) appleTitle.setAttribute('content', 'حاسبة الاستثمار');
          } else {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
            if (manifestEl) manifestEl.setAttribute('href', '/manifest.webmanifest');
            if (appleTitle) appleTitle.setAttribute('content', 'Investment Calculator');
          }

          var savedTheme = localStorage.getItem('investment_calc_theme');
          var isDark = savedTheme === 'dark'; // Light mode is default
          var themeColorMeta = document.getElementById('meta-theme-color');
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            if (themeColorMeta) themeColorMeta.setAttribute('content', '#080c14');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            if (themeColorMeta) themeColorMeta.setAttribute('content', '#f8fafc');
          }
        } catch (e) {}
      })();
    </script>
